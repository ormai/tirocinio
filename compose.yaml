services:
  db:
    image: postgres
    container_name: tirocinio-db
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - app-data:/var/lib/postgresql
    networks:
      - postgres

  app:
    image: ghcr.io/ormai/tirocinio:main
    container_name: tirocinio
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres
    ports:
      - 3000:3000

volumes:
  app-data:

networks:
  postgres:
    driver: bridge
