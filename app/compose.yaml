# TODO: rebrand

services:
  db:
    image: postgres
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - app-data:/var/lib/postgresql
    networks:
      - postgres
    ports:
      - 5432:5432

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres
    ports:
      - 3000:3000

volumes:
  app-data:

networks:
  postgres:
    driver: bridge
